{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">
    <title>Verificación OTP</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .card-otp {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: white;
            text-align: center;
        }
        .icono { font-size: 3.5rem; color: #1e3c72; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="card-otp">
    <div class="icono"><i class="fas fa-lock"></i></div>
    <h3 class="fw-bold text-primary mb-2">Verificación de Seguridad</h3>
    <p class="text-muted small mb-4">
        Ingresa el código de 6 dígitos generado por tu aplicación autenticadora para confirmar tu identidad.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger alert-dismissible fade show text-start small p-2" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i> {{ message }}
                <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'verificar_otp' %}" class="text-start mt-2">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Código de Autenticación</label>
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-light"><i class="fas fa-key text-muted"></i></span>
                <input type="text" name="otp" class="form-control text-center fw-bold fs-4" placeholder="000 000" maxlength="6" pattern="\d{6}" inputmode="numeric" autocomplete="one-time-code" required autofocus style="letter-spacing: 5px;">
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm" style="background: #1e3c72; border: none; border-radius: 8px;">
                <i class="fas fa-check-circle me-2"></i> Verificar y Entrar
            </button>
        </div>
    </form>

    <div class="mt-4">
        <a href="{% url 'login' %}" class="text-decoration-none text-muted small fw-bold">
            <i class="fas fa-arrow-left me-1"></i> Cancelar
        </a>
    </div>
</div>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
